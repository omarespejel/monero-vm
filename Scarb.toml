[package]
name = "monero_vm"
version = "0.1.0"
edition = "2024_07"
# Cairo 2.11.4 - Compatible with Starknet 0.13.4 
cairo-version = "2.11.4"

[dependencies]
starknet = "2.11.4"
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v2.0.0" }
openzeppelin_merkle_tree = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v2.0.0" }

[dev-dependencies]
# Use deprecated package for Scarb < 2.12.0
snforge_std_deprecated = "0.55.0"
assert_macros = "2.10.0"
cairo_test = "2.11.4"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std_deprecated"]

[scripts]
test = "snforge test"

[features]
fp_vectors = []
full_tests = []

[[target.starknet-contract]]
sierra = true
casm = true
# Using audited libfuncs for testnet compatibility
allowed-libfuncs-list.name = "audited"
